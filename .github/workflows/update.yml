name: Update public configs

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - collect.py
      - sources.json
      - tests/**
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-configs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Collect public configs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python collect.py
      - name: Publish subscriptions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- configs.txt base64.txt status.json data/sources
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update public proxy subscriptions'
          git pull --rebase origin main
          git push origin HEAD:main
